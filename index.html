<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер нашей любви</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #f5ecd7; /* бежевый фон */
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 182, 213, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 182, 213, 0.25) 0%, transparent 40%);
            color: #5a4a3a;
        }

        /* Плавающие сердечки на фоне */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .hearts-bg span {
            position: absolute;
            bottom: -50px;
            font-size: 22px;
            color: #ff9ec4;
            opacity: 0.6;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.7; }
            90%  { opacity: 0.7; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            background: #fffaf0; /* светлый бежевый */
            padding: 2.5rem 3.5rem;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(180, 140, 100, 0.25),
                        0 0 60px rgba(255, 158, 196, 0.25);
            border: 2px solid #ffd6e7;
        }

        /* Часы над заголовком */
        .clock-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            display: block;
            animation: tick 2s ease-in-out infinite;
        }
        @keyframes tick {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(8deg); }
        }

        h1 {
            font-weight: 400;
            font-size: 1.5rem;
            margin: 0 0 1.5rem 0;
            color: #d16a95;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 158, 196, 0.5);
        }

        .timer-display {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            font-variant-numeric: tabular-nums;
            color: #ff6fa5; /* розовый таймер */
            text-shadow: 0 0 15px rgba(255, 111, 165, 0.35);
        }

        .label {
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #b08a6e;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Сердечки по бокам таймера */
        .timer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }
        .side-heart {
            font-size: 1.8rem;
            color: #ff6fa5;
            animation: pulse 1.4s ease-in-out infinite;
        }
        .side-heart:last-child {
            animation-delay: 0.7s;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50%      { transform: scale(1.25); opacity: 1; }
        }

        @media (max-width: 480px) {
            .container { padding: 1.8rem 1.5rem; }
            .timer-display { font-size: 1.9rem; letter-spacing: 1px; }
            h1 { font-size: 1.1rem; letter-spacing: 1.5px; }
            .clock-icon { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<!-- Плавающие сердечки на фоне (генерируются скриптом) -->
<div class="hearts-bg" id="heartsBg"></div>

<div class="container">
    <span class="clock-icon">🕰️</span>
    <h1>Таймер нашей любви</h1>

    <div class="timer-row">
        <span class="side-heart">💖</span>
        <div id="timer" class="timer-display">Загрузка...</div>
        <span class="side-heart">💖</span>
    </div>

    <div class="label">дней : часов : минут : секунд</div>
</div>

<script>
    // 1. Точка отсчёта: 1 марта 2026, 16:45:00
    // Месяцы в JavaScript считаются с 0, поэтому март — это 2.
    const startDate = new Date(2026, 2, 1, 16, 45, 0);

    function updateTimer() {
        const now = new Date();
        const diffMs = now - startDate;

        if (diffMs < 0) {
            document.getElementById('timer').textContent = "00 : 00 : 00 : 00";
            return;
        }

        const secondsTotal = Math.floor(diffMs / 1000);

        const days    = Math.floor(secondsTotal / (24 * 3600));
        const hours   = Math.floor((secondsTotal % (24 * 3600)) / 3600);
        const minutes = Math.floor((secondsTotal % 3600) / 60);
        const seconds = secondsTotal % 60;

        const format = (num) => String(num).padStart(2, '0');

        document.getElementById('timer').textContent =
            `${format(days)} : ${format(hours)} : ${format(minutes)} : ${format(seconds)}`;
    }

    updateTimer();
    setInterval(updateTimer, 1000);

    // 2. Генерируем плавающие сердечки на фоне
    const heartsContainer = document.getElementById('heartsBg');
    const heartSymbols = ['💖', '💕', '❤️', '💗', '🌸'];
    const heartsCount = 18;

    for (let i = 0; i < heartsCount; i++) {
        const heart = document.createElement('span');
        heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.fontSize = (14 + Math.random() * 22) + 'px';
        heart.style.animationDuration = (8 + Math.random() * 10) + 's';
        heart.style.animationDelay = (Math.random() * 10) + 's';
        heart.style.opacity = 0.4 + Math.random() * 0.4;
        heartsContainer.appendChild(heart);
    }
</script>

</body>
</html>
